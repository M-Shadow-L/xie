<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>给你的一封信</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff3f5;
      font-family: system-ui, sans-serif;
    }

    .scene {
      padding: 150px 20px 40px;
      text-align: center;
    }

    .hint {
      margin-bottom: 30px;
      color: #885e68;
    }

    .envelope {
      position: relative;
      width: 300px;
      height: 200px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      overflow: visible;
    }

    .back {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: 8px;
      background: #f3a5b5;
    }

    .letter {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 10px;
      z-index: 1;
      height: 170px;
      display: grid;
      place-items: center;
      padding: 20px;
      border-radius: 8px;
      background: #fffdf8;
      color: #a63d58;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgb(120 50 70 / 18%);
      opacity: 0;
      transform: translateY(80px) scale(0.85);
    }

    .front {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 8px;
      background: #f7bdc8;
      clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    }

    .flap {
      position: absolute;
      inset: 0;
      z-index: 4;
      border-radius: 8px;
      background: #ed91a5;
      clip-path: polygon(0 0, 100% 0, 50% 60%);
      transform-origin: top;
      transition: transform 450ms ease;
    }

    .envelope.open .flap {
      z-index: 1;
      transform: rotateX(180deg);
    }

    .envelope.open .letter {
      z-index: 5;
      animation: letter-pop 900ms cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
    }

    @keyframes letter-pop {
      0% {
        opacity: 0;
        transform: translateY(80px) scale(0.85);
      }
      60% {
        opacity: 1;
        transform: translateY(-125px) scale(1.04);
      }
      80% {
        transform: translateY(-95px) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(-105px) scale(1);
      }
    }

    .envelope:focus-visible {
      outline: 3px solid #a63d58;
      outline-offset: 8px;
      border-radius: 8px;
    }

    .envelope.open {
      cursor: default;
    }

    @media (max-width: 360px) {
      .envelope {
        width: 270px;
      }

      .letter {
        font-size: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <p class="hint" id="hint">点一下信封，打开这封信</p>

    <button
      class="envelope"
      id="envelope"
      type="button"
      aria-label="打开信封"
      aria-describedby="hint"
    >
      <span class="back"></span>
      <span class="letter">你的爸爸是谢柏毅</span>
      <span class="front"></span>
      <span class="flap"></span>
    </button>
  </main>

  <script>
    const envelope = document.getElementById("envelope");

    envelope.addEventListener("click", () => {
      envelope.classList.add("open");
      envelope.setAttribute("aria-label", "信已打开：你的爸爸是谢柏毅");
    }, { once: true });
  </script>
</body>
</html>
